[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-scorer"
version = "0.1.0"
description = "Reference: pocket-off recall scoring, sibling-value leaks and invented specifics"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
